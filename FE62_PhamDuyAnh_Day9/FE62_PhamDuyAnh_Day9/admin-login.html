<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Admin - ShopPhone</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                    <h1>Admin Panel</h1>
                </div>
                <p>Đăng nhập để quản lý hệ thống</p>
                <!-- <div class="login-info">
                    <p><strong>Thông tin đăng nhập mặc định:</strong></p>
                    <p>Tên đăng nhập: <code>admin</code></p>
                    <p>Mật khẩu: <code>admin123</code></p>
                </div> -->
            </div>
            
            <form id="adminLoginForm" class="login-form">
                <div class="form-group">
                    <label for="adminUsername">
                        <i class="fas fa-user"></i> Tên đăng nhập
                    </label>
                    <input type="text" id="adminUsername" name="username" required placeholder="Nhập tên đăng nhập">
                </div>
                
                <div class="form-group">
                    <label for="adminPassword">
                        <i class="fas fa-lock"></i> Mật khẩu
                    </label>
                    <div class="password-input">
                        <input type="password" id="adminPassword" name="password" required placeholder="Nhập mật khẩu">
                        <i class="fas fa-eye" onclick="togglePassword('adminPassword', this)"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Đăng Nhập
                </button>
                
                <div class="login-footer">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left"></i> Quay lại trang chủ
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
